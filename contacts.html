<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me NOW - Dashboard</title>

  <!-- Bootstrap 5.3 CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
    crossorigin="anonymous"
  >
  <!-- Bootstrap Icons -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >
</head>
<body class="bg-body-tertiary min-vh-100" onload="readCookie(); initDashboard();">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg bg-body border-bottom border-secondary-subtle">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-person-lines-fill text-primary me-2"></i>Contact Me NOW
      </a>
      
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text text-body-secondary fw-medium" id="userNameDisplay">
          Logged in
        </span>
        <button class="btn btn-outline-danger btn-sm" onclick="doLogout();">
          <i class="bi bi-box-arrow-right me-1"></i> Log Out
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        
        <div class="card bg-body shadow-sm rounded-3 p-4">
          <div class="card-body text-center py-5">
            <i class="bi bi-person-badge display-1 text-secondary mb-3"></i>
            <h2 class="fw-bold mb-2">Welcome to Your Contacts Manager</h2>
            <p class="text-body-secondary mb-4">
              Temporary contact management dashboard interface.
            </p>

            <div class="alert alert-info d-inline-block text-start px-4 py-3" role="alert">
              <i class="bi bi-info-circle-fill me-2"></i>
              <strong>User Authenticated:</strong>
              <div class="mt-1 small" id="userInfoDetails">Loading session...</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="js/code.js"></script>
  <script>
    function initDashboard() {
      const nameDisplay = document.getElementById("userNameDisplay");
      const detailsDisplay = document.getElementById("userInfoDetails");

      if (firstName || lastName) {
        if (nameDisplay) nameDisplay.textContent = `Logged in as ${firstName} ${lastName}`;
        if (detailsDisplay) detailsDisplay.innerHTML = `Name: <strong>${firstName} ${lastName}</strong> (User ID: ${userId})`;
      } else if (userId > 0) {
        if (nameDisplay) nameDisplay.textContent = `Logged in (User ID: ${userId})`;
        if (detailsDisplay) detailsDisplay.innerHTML = `User ID: <strong>${userId}</strong>`;
      }
    }
  </script>
</body>
</html>
