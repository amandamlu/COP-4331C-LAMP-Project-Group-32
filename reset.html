<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card bg-body text-body shadow-lg rounded-3 p-4">
          <div class="card-body">
            <h3 class="fw-bold mb-3 text-primary">Reset Password</h3>
            <p class="text-body-secondary mb-4">Enter your username, the code sent to you, and your new password.</p>
            
            <form onsubmit="submitReset(event);" class="d-flex flex-column gap-3">
              <div>
                <label class="form-label text-body-secondary fw-medium mb-1">Username</label>
                <input type="text" id="resetUsername" class="form-control bg-body-tertiary border-secondary-subtle" required placeholder="Your username">
              </div>
              <div>
                <label class="form-label text-body-secondary fw-medium mb-1">Reset Code</label>
                <input type="text" id="resetCode" class="form-control bg-body-tertiary border-secondary-subtle" required placeholder="6-digit code">
              </div>
              <div>
                <label class="form-label text-body-secondary fw-medium mb-1">New Password</label>
                <input type="password" id="newPassword" class="form-control bg-body-tertiary border-secondary-subtle" required placeholder="New password">
              </div>
              
              <button type="submit" class="btn btn-primary fs-5 fw-bold py-2 mt-3">Submit Password</button>
              <div id="resetResult" class="mt-2 small fw-semibold"></div>
            </form>
            
            <div class="mt-3 text-center">
              <a href="index.html" class="text-body-secondary text-decoration-underline">Back to Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function submitReset(event) {
      event.preventDefault();
      
      const username = document.getElementById("resetUsername").value.trim();
      const code = document.getElementById("resetCode").value.trim();
      const newPassword = document.getElementById("newPassword").value.trim();
      const resultEl = document.getElementById("resetResult");
      
      resultEl.className = "mt-2 small text-info fw-semibold";
      resultEl.textContent = "Updating password...";

      try {
        const res = await fetch('/api/index.php?action=setnewpwd', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, code: code, newpassword: newPassword })
        });

        const data = await res.json();

        if (res.ok) {
          resultEl.className = "mt-2 small text-success fw-semibold";
          resultEl.textContent = "Password reset successfully! Redirecting to login...";
          setTimeout(() => { window.location.href = "index.html"; }, 2000);
        } else {
          resultEl.className = "mt-2 small text-danger fw-semibold";
          resultEl.textContent = data.error || data.message || "Failed to reset password. Check your code.";
        }
      } catch (err) {
        resultEl.className = "mt-2 small text-danger fw-semibold";
        resultEl.textContent = "Network error. Could not reach the server.";
      }
    }
  </script>
</body>
</html>
